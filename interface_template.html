<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent 4 — Semantic & KPI</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#12222a;--mute:#62757d;--line:#dde5e8;--acc:#0b7a75;--acc2:#e08a00;--c3:#5b6ee1;--ok:#1a8a4a;--bad:#c2410c;--soft:#e8f4f3;--shadow:0 1px 2px rgba(18,34,42,.06),0 8px 24px rgba(18,34,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c171c;--card:#13232a;--ink:#e8f1f2;--mute:#9bb2b8;--line:#25404a;--acc:#4fd1c5;--acc2:#f6ad37;--c3:#8b9bff;--ok:#4ade80;--bad:#fb923c;--soft:#173a3d;--shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c171c;--card:#13232a;--ink:#e8f1f2;--mute:#9bb2b8;--line:#25404a;--acc:#4fd1c5;--acc2:#f6ad37;--c3:#8b9bff;--ok:#4ade80;--bad:#fb923c;--soft:#173a3d;--shadow:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.1rem}.logo i{font-style:normal;color:var(--acc)}.meta{color:var(--mute);font-size:.82rem}.sp{flex:1}
.badge{border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--ok)}.badge.w{background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}
nav{max-width:1120px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mute);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:18px 18px 60px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c3,.c4,.c6,.c8{grid-column:span 12}.c3{grid-column:span 6}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.kpi b{display:block;font-size:1.9rem;line-height:1.15;letter-spacing:-.02em}.kpi small{color:var(--mute)}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--acc);white-space:nowrap}.tag.w{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.82rem;cursor:pointer}.pill[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.hb{display:grid;grid-template-columns:minmax(90px,1.3fr) 3fr auto;gap:10px;align-items:center;margin:9px 0;font-size:.86rem}
.hb .t{background:var(--soft);border-radius:6px;height:14px;overflow:hidden}.hb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--c3));border-radius:6px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{display:block;max-width:100%}svg text{fill:var(--mute);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin-top:8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{color:var(--mute);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}
code,pre{font:.8rem ui-monospace,Consolas,monospace;background:var(--soft);border-radius:6px}code{padding:1px 6px}pre{padding:10px;overflow-x:auto;white-space:pre-wrap;margin:0}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;max-width:340px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:.84rem;cursor:pointer}
.flow{display:grid;gap:10px;grid-template-columns:repeat(7,1fr)}@media(max-width:900px){.flow{grid-template-columns:repeat(2,1fr)}}
.st{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.st b{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc);margin-bottom:6px;font-size:.85rem}
.st span{display:block;font-weight:600;font-size:.88rem}.st small{color:var(--mute);font-size:.75rem}
.st[aria-pressed=true]{border:2px solid var(--acc)}.st[aria-pressed=true] b{background:var(--acc);color:#fff}.st.off{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:70px 20px;color:var(--mute)}.empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
section[hidden]{display:none}#msg{font-size:.82rem;color:var(--mute);margin:0 0 10px}
</style>
</head>
<body>
<header>
<div class="bar"><span class="logo">Agent <i>4</i> · Semantic &amp; KPI</span><span class="meta" id="per"></span><span class="sp"></span><span class="badge" id="bd" hidden></span>
<label class="btn" for="f">Charger des fichiers</label><input type="file" id="f" accept=".json" multiple hidden></div>
<nav role="tablist"><button role="tab" aria-selected="true" data-t="A">Résultats</button><button role="tab" aria-selected="false" data-t="B">Fonctionnement</button><button role="tab" aria-selected="false" data-t="C">KPI catalog</button><button role="tab" aria-selected="false" data-t="D">Justesse</button><button role="tab" aria-selected="false" data-t="E">Analyse</button></nav>
</header>
<main><p id="msg" aria-live="polite"></p><section id="A"></section><section id="B" hidden></section><section id="C" hidden></section><section id="D" hidden></section><section id="E" hidden></section></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v=="number"?v.toLocaleString("fr-FR",{maximumFractionDigits:d}):esc(v??"—");
const short=v=>typeof v!="number"?"—":Math.abs(v)>=1e6?(v/1e6).toLocaleString("fr-FR",{maximumFractionDigits:2})+" M":Math.abs(v)>=1e3?(v/1e3).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k":fmt(v);
let D={res:null,cat:null,aud:null,acc:null,ana:null},topKey="top_countries",stepKey="charger_donnees";
const val=k=>D.res&&D.res[k]?D.res[k].valeur:null,ev=s=>(D.aud||[]).find(e=>e.etape==s);
const COL=["var(--acc)","var(--acc2)","var(--c3)","#d9467a"];
const STEPS=[["charger_donnees","Chargement","Récupère la table de faits (fact_trade)."],["comprendre_colonnes","Colonnes → rôles","Devine le rôle de chaque colonne."],["calculer_kpi","Calcul des KPI","Calcule les KPI dont les colonnes existent."],["documenter_kpi","Documentation","Écrit définition, formule et DAX."],["controler","Contrôles","Vérifie la cohérence des chiffres."],["analyser_kpi","Analyse","Écrit un constat par KPI (règles, sans LLM)."],["exporter","Export","Écrit les fichiers et le journal."]];

function ring(p){const r=44,c=2*Math.PI*r,o=c*(1-Math.min(Math.max(p,0),100)/100);
return`<svg viewBox="0 0 120 120" width="130" role="img" aria-label="${fmt(p)} % expédiées à temps"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${fmt(p,1)}%</text></svg>`}
function cols(o,mo){const k=Object.keys(o).sort(),mx=Math.max(...k.map(x=>o[x])),H=150,bw=58;
return`<svg viewBox="0 0 ${k.length*84+10} ${H+44}" style="max-width:380px;margin:0 auto" width="100%" role="img" aria-label="Chiffre d'affaires par année">${k.map((y,i)=>{const h=o[y]/mx*H,inc=mo&&mo[y]<12,x=i*84+14+bw/2;return`<rect x="${i*84+14}" y="${H-h}" width="${bw}" height="${h}" rx="8" fill="${COL[i%4]}" opacity="${inc?.55:1}"><title>${y} : ${fmt(o[y])}</title></rect><text x="${x}" y="${H-h-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${short(o[y])}</text><text x="${x}" y="${H+16}" text-anchor="middle">${y}</text>${mo?`<text x="${x}" y="${H+30}" text-anchor="middle" style="fill:${inc?"var(--bad)":"var(--mute)"}">${mo[y]} mois</text>`:""}`}).join("")}</svg>`}
function hbars(rows){const mx=Math.max(...rows.map(x=>x.valeur));return rows.map(x=>`<div class="hb"><span title="${esc(x.nom)}">${esc(x.nom)}</span><div class="t"><i style="width:${x.valeur/mx*100}%"></i></div><span><b>${fmt(x.part_pct,1)} %</b></span></div>`).join("")}
const kpi=(k,sub)=>{const x=D.res[k];return x?`<div class="card kpi c3"><h3>${esc(x.nom)}</h3><b>${fmt(x.valeur)}</b><small>${esc(sub||x.unite)}</small></div>`:""};
const empty=()=>`<div class="empty"><b>Aucune donnée chargée</b>Lance <code>python make_interface.py</code> (la page s'ouvre avec les résultats), ou clique sur « Charger des fichiers » et choisis <code>kpi_results.json</code>, <code>kpi_catalog.json</code> et <code>agent4_audit_log.json</code>.</div>`;

function viewA(){if(!D.res)return empty();const r=D.res;let h=`<div class="grid">`;
h+=kpi("total_revenue","chiffre d'affaires")+kpi("order_count","commandes")+kpi("avg_order_value","par commande");
const y=val("yoy_growth"),yk=y&&y.croissance_pct?Object.keys(y.croissance_pct).sort().pop():null;
h+=yk?`<div class="card kpi c3"><h3>Croissance ${yk}</h3><b>${fmt(y.croissance_pct[yk],1)} %</b><small>sur les mêmes mois qu'en ${yk-1}</small></div>`:`<div class="card kpi c3"><h3>Croissance</h3><b>—</b><small>pas assez d'années</small></div>`;
if(y&&y.ca_par_annee)h+=`<div class="card c6"><h3>CA par année <span>croissance sur mêmes mois</span></h3>${cols(y.ca_par_annee,y.mois_couverts)}<div class="legend">${Object.keys(y.ca_par_annee).sort().map(a=>`<span>${a} ${y.croissance_pct&&y.croissance_pct[a]!=null?`<span class="tag">${y.croissance_pct[a]>0?"+":""}${fmt(y.croissance_pct[a],1)} %</span>`:""}</span>`).join("")}</div>${y.mois_couverts&&Object.values(y.mois_couverts).some(m=>m<12)?'<p style="margin:10px 0 0;font-size:.82rem;color:var(--bad)">Années incomplètes (barres pâles) : leurs totaux ne sont pas comparables. La croissance est calculée sur les mêmes mois.</p>':""}</div>`;
if(r.on_time_rate||r.avg_lead_time)h+=`<div class="card c6"><h3>Livraison</h3><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${r.on_time_rate?ring(r.on_time_rate.valeur):""}<div><b style="font-size:1.5rem">${r.avg_lead_time?fmt(r.avg_lead_time.valeur,1)+" j":"—"}</b><br><small style="color:var(--mute)">délai moyen commande → expédition</small><br><small style="color:var(--mute)">Anneau : part des commandes expédiées à temps</small></div></div></div>`;
const tops=["top_countries","top_products"].filter(k=>r[k]);
if(tops.length){if(!tops.includes(topKey))topKey=tops[0];h+=`<div class="card c6"><h3>Classements <span>top 5 · part du CA</span></h3><div class="pills">${tops.map(k=>`<button class="pill" data-top="${k}" aria-pressed="${k==topKey}">${esc(r[k].nom.replace("Top ",""))}</button>`).join("")}</div>${hbars(r[topKey].valeur)}</div>`}
const ig=(ev("calculer_kpi")||{}).ignores_detail||{},ik=Object.keys(ig);
h+=r.trade_balance?kpi("total_exports","valeur")+kpi("total_imports","valeur")+kpi("trade_balance","exports − imports")+kpi("coverage_ratio","couverture des imports"):`<div class="card c6"><h3>Commerce international <span class="tag w">non calculable</span></h3>${ik.length?ik.map(k=>`<div style="margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)"><b>${esc(ig[k].nom)}</b><br><small style="color:var(--mute)">Formule :</small> <code>${esc(ig[k].formule)}</code><br><small style="color:var(--mute)">${esc(ig[k].raison)}</small></div>`).join(""):"—"}</div>`;
return h+`</div>`}

function detail(e){if(!e)return`<p style="color:var(--mute)">Cette étape n'a pas été exécutée.</p>`;
let h=`<p><b>${esc(e.message)}</b> <small style="color:var(--mute)">· ${esc((e.heure||"").replace("T"," "))}</small></p>`;
if(e.tables)h+=`<div class="scroll"><table><tr><th>Table</th><th>Lignes</th></tr>${Object.entries(e.tables).map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${fmt(b,0)}</td></tr>`).join("")}</table></div>`;
if(e.mapping)h+=`<div class="scroll"><table><tr><th>Rôle</th><th>Colonne trouvée</th></tr>${Object.entries(e.mapping).map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join("")}</table></div>`;
if(e.calcules)h+=`<h3 style="margin:12px 0 6px;font-size:.8rem;color:var(--mute)">CALCULÉS</h3><div class="chips">${e.calcules.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div>`+(Object.keys(e.ignores_detail||{}).length?`<h3 style="margin:12px 0 6px;font-size:.8rem;color:var(--mute)">IGNORÉS</h3>${Object.entries(e.ignores_detail).map(([k,v])=>`<div style="margin:8px 0"><span class="tag w">${esc(v.nom)}</span><br><small style="color:var(--mute)">Formule :</small> <code>${esc(v.formule)}</code><br><small style="color:var(--mute)">${esc(v.raison)}</small></div>`).join("")}`:"");
if(e.controles)h+=`<div class="scroll"><table><tr><th>Contrôle</th><th>Résultat</th><th>Statut</th></tr>${e.controles.map(c=>`<tr><td>${esc(c.controle)}</td><td>${esc(c.detail)}</td><td><span class="tag ${c.statut=="ok"?"":"w"}">${esc(c.statut)}</span></td></tr>`).join("")}</table></div>`;
return h}
function viewB(){if(!D.res)return empty();
return`<div class="flow">${STEPS.map((s,i)=>`<button class="st${ev(s[0])?"":" off"}" data-step="${s[0]}" aria-pressed="${s[0]==stepKey}"><b>${ev(s[0])?"✓":i+1}</b><span>${s[1]}</span><small>${ev(s[0])?esc((ev(s[0]).heure||"").slice(11)):"non exécutée"}</small></button>`).join("")}</div><div class="card" style="margin-top:14px" id="sd"></div>`}
function drawStep(){const s=STEPS.find(x=>x[0]==stepKey),d=$("sd");if(!d)return;d.innerHTML=`<h3>Étape · <code>${s[0]}</code></h3><p style="margin:0 0 10px">${s[2]}</p>${detail(ev(stepKey))}`}

function viewC(){if(!D.res)return empty();const cat=D.cat||Object.values(D.res).map(x=>({nom:x.nom,bo:x.bo,pourquoi:x.pourquoi,definition:x.definition,formule:x.formule,dax:"—",colonnes_sources:x.colonnes_sources}));D._cat=cat;
return`<div class="card"><h3>KPI catalog <span>${cat.length} KPI</span></h3><input type="search" id="q" placeholder="Rechercher un KPI…" aria-label="Rechercher"><div class="scroll"><table id="ct"></table></div></div>`}
function drawCat(){const t=$("ct");if(!t)return;const q=$("q").value.toLowerCase();
t.innerHTML=`<tr><th>KPI</th><th>BO</th><th>Pourquoi ce KPI</th><th>Formule</th><th>Origine des données</th><th>DAX</th></tr>`+D._cat.filter(k=>JSON.stringify(k).toLowerCase().includes(q)).map(k=>`<tr><td><b>${esc(k.nom)}</b><br><small style="color:var(--mute)">${esc(k.definition)}</small></td><td><span class="tag">${esc(k.bo||"—")}</span></td><td>${esc(k.pourquoi||"—")}</td><td>${esc(k.formule)}</td><td>${k.origine?Object.entries(k.origine).map(([c,s])=>`<div><code>${esc(c)}</code> ← ${esc(s)}</div>`).join(""):(k.colonnes_sources||[]).map(c=>`<code>${esc(c)}</code>`).join(" ")}</td><td><pre>${esc(k.dax)}</pre></td></tr>`).join("")}
function viewD(){if(!D.res)return empty();const a=D.acc;
if(!a||!a.length)return`<div class="card"><h3>Justesse des KPI</h3><p style="color:var(--mute);margin:0">Aucune vérification chargée. Lance <code>python make_interface.py</code> sur le dossier des 7 CSV, ou <code>python verify_kpis.py</code>.</p></div>`;
const ok=a.filter(x=>x.statut=="identique").length;
return`<div class="grid"><div class="card kpi c4"><h3>Résultat</h3><b>${ok}/${a.length}</b><small>valeurs identiques à la référence</small></div><div class="card c8"><h3>Agent contre référence <span>tolérance 0,01</span></h3><div class="scroll"><table><tr><th>KPI</th><th>Agent</th><th>Référence</th><th>Source</th><th>Écart</th><th>Statut</th></tr>${a.map(x=>`<tr><td>${esc(x.kpi)}</td><td>${fmt(x.agent,4)}</td><td>${fmt(x.reference,4)}</td><td>${esc(x.source)}</td><td>${fmt(x.ecart,4)}</td><td><span class="tag ${x.statut=="identique"?"":"w"}">${esc(x.statut)}</span></td></tr>`).join("")}</table></div></div></div>`}

function viewE(){if(!D.res)return empty();const a=D.ana;
if(!a||!a.length)return`<div class="card"><h3>Analyse des KPI</h3><p style="color:var(--mute);margin:0">Aucune analyse chargée. Lance <code>python make_interface.py</code>, ou charge <code>kpi_analysis.json</code>.</p></div>`;
const w=a.filter(x=>x.niveau=="attention").length,llm=a.some(x=>x.interpretation);
return`<div class="grid"><div class="card kpi c4"><h3>Points d'attention</h3><b>${w}</b><small>sur ${a.length} constats</small></div><div class="card c8"><h3>Résumé <span class="tag ${llm?"":"w"}">${llm?"rédigé par le LLM":"règles seulement"}</span></h3><p style="margin:0">${D.resume?esc(D.resume):'<span style="color:var(--mute)">Pas de résumé LLM (lance avec USE_LLM=1, ou le LLM a utilisé un chiffre inconnu et sa phrase a été rejetée).</span>'}</p></div><div class="card c12"><h3>Constats <span>chiffres vérifiés contre les KPI</span></h3><div class="scroll"><table><tr><th>KPI</th><th>Constat (règle)</th><th>Interprétation</th><th>Règle appliquée</th><th>Niveau</th></tr>${a.map(x=>`<tr><td>${esc(x.nom)}</td><td>${esc(x.constat)}</td><td>${x.interpretation?esc(x.interpretation)+' <span class="tag">LLM</span>':'<small style="color:var(--mute)">—</small>'}</td><td><small style="color:var(--mute)">${esc(x.regle)}</small></td><td><span class="tag ${x.niveau=="attention"?"w":""}">${esc(x.niveau)}</span></td></tr>`).join("")}</table></div></div></div>`}
function render(){try{$("A").innerHTML=viewA();$("B").innerHTML=viewB();$("C").innerHTML=viewC();$("D").innerHTML=viewD();$("E").innerHTML=viewE();
document.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>{topKey=b.dataset.top;render()});
document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{stepKey=b.dataset.step;render()});
if($("q")){$("q").oninput=drawCat;drawCat()}drawStep();
const ck=(ev("controler")||{}).controles,bd=$("bd");if(ck){const w=ck.filter(c=>c.statut!="ok").length;bd.hidden=false;bd.className="badge"+(w?" w":"");bd.textContent=w?`${w} avertissement(s)`:"Contrôles OK";bd.title=ck.filter(c=>c.statut!="ok").map(c=>c.controle+" : "+c.detail).join(" ; ")}
$("per").textContent=D.res?Object.keys(D.res).length+" KPI calculés":""}
catch(e){$("A").innerHTML=`<div class="empty"><b>Erreur d'affichage</b>${esc(e.message)}</div>`}}
function load(res,cat,aud,acc,ana,resume){D={res,cat,aud,acc,ana,resume:resume===undefined?D.resume:resume};render()}
async function ingest(files){const n={res:D.res,cat:D.cat,aud:D.aud,acc:D.acc,ana:D.ana},ok=[],ko=[];
for(const f of files){try{const j=JSON.parse((await f.text()).replace(/\bNaN\b/g,"null"));
if(Array.isArray(j)&&j[0]&&"constat" in j[0]){n.ana=j;ok.push(f.name)}else if(Array.isArray(j)&&j[0]&&"reference" in j[0]){n.acc=j;ok.push(f.name)}else if(Array.isArray(j)&&j[0]&&"dax" in j[0]){n.cat=j;ok.push(f.name)}else if(Array.isArray(j)){n.aud=j;ok.push(f.name)}else if(j&&typeof j=="object"){n.res=j;ok.push(f.name)}else ko.push(f.name)}catch(x){ko.push(f.name+" : "+x.message)}}
$("msg").textContent=(ok.length?"Lus : "+ok.join(", "):"")+(ko.length?"  Erreur : "+ko.join(" | "):"");load(n.res,n.cat,n.aud,n.acc,n.ana)}
$("f").onchange=async e=>{await ingest(e.target.files);e.target.value=""};
addEventListener("dragover",e=>e.preventDefault());addEventListener("drop",e=>{e.preventDefault();ingest(e.dataTransfer.files)});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x==b));["A","B","C","D","E"].forEach(i=>$(i).hidden=i!=b.dataset.t)});
if(window.__DATA__){const d=window.__DATA__;load(d.res,d.cat,d.aud,d.acc,d.ana,d.resume)}else render();
</script>
</body>
</html>
